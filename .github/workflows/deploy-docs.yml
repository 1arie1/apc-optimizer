name: Docs

# Publishes the docs site to GitHub Pages. Spec/docs drift is caught on PRs by the `build` job in
# lean_action_ci.yml (which runs `lake build docs`), so this workflow only builds to *deploy* — from
# main or a manual dispatch, never on PRs (a second `build`-named job on PRs would collide with the
# required `build` check).
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'ApcOptimizer/**'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

# Supersede older runs; the Pages deploy has its own group below.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  docs-build:
    runs-on: warp-ubuntu-2404-x64-32x
    steps:
      - uses: actions/checkout@v4
      # Installs the toolchain from lean-toolchain and fetches the mathlib olean cache.
      - uses: leanprover/lean-action@v1
        with:
          build: false
      - name: Build docs site
        run: docs/build.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_out/html-single

  deploy:
    needs: docs-build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
