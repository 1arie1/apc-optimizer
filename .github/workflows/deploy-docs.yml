name: Docs

on:
  push:
    branches: [main]
    paths: &docs-paths
      - 'docs/**'
      - 'ApcOptimizer/**'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - '.github/workflows/deploy-docs.yml'
  pull_request:
    paths: *docs-paths
  workflow_dispatch:

# Supersede older runs of the same branch/PR; the Pages deploy has its own group below.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # Runs on every relevant PR and on main. The docs splice the audited spec live (via
  # `{docstring}` and `anchor` regions of ApcOptimizer/), so a successful build is a
  # spec/docs drift check: renaming a definition or a `-- ANCHOR:` comment fails here.
  build:
    runs-on: warp-ubuntu-2404-x64-32x
    steps:
      - uses: actions/checkout@v4
      # Installs the toolchain from lean-toolchain and fetches the mathlib olean cache.
      - uses: leanprover/lean-action@v1
        with:
          build: false
      - name: Build docs site
        run: docs/build.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_out/html-single

  # Publish only from main (and manual dispatch); PRs build but never deploy.
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
