name: Docs

# Publishes the docs site to GitHub Pages. Spec/docs drift is caught on PRs by the `build` job in
# lean_action_ci.yml (which runs `lake build docs`), so this workflow only builds to *deploy* — from
# main or a manual dispatch, never on PRs (a second `build`-named job on PRs would collide with the
# required `build` check).
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'ApcOptimizer/**'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

# Supersede older runs; the Pages deploy has its own group below.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  docs-build:
    runs-on: warp-ubuntu-2404-x64-32x
    steps:
      - uses: actions/checkout@v4
      # Installs the toolchain from lean-toolchain and fetches the mathlib olean cache.
      - uses: leanprover/lean-action@v1
        with:
          build: false
      # LaTeX toolchain for the PDF: xelatex + latexmk, the Source Pro / DejaVu fonts the Verso
      # preamble uses (texlive-fonts-extra), and rsvg-convert (librsvg2-bin) for the figures.
      - name: Install TeX + SVG tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex texlive-latex-extra texlive-fonts-extra latexmk librsvg2-bin
      # Build the PDF (best-effort — never block publishing the site on it), then the site, then
      # drop the PDF into the site so it deploys at <site>/apc_optimizer.pdf.
      - name: Build site + PDF
        run: |
          if docs/build.sh --pdf; then
            cp docs/_out/tex/apc_optimizer.pdf "$RUNNER_TEMP/apc_optimizer.pdf"
          else
            echo "::warning::PDF build failed; publishing the site without it"
          fi
          docs/build.sh
          if [ -f "$RUNNER_TEMP/apc_optimizer.pdf" ]; then
            cp "$RUNNER_TEMP/apc_optimizer.pdf" docs/_out/html-single/
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_out/html-single

  deploy:
    needs: docs-build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
